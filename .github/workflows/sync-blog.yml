name: Sync Blog Posts

on:
  schedule:
    # Runs daily at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize blog posts
        run: node scripts/sync-blog.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data/blog-posts.json)" ]; then
            git add src/data/blog-posts.json
            git commit -m "chore(blog): sync latest posts from blog.farrosfr.com"
            git push
          else
            echo "No new blog posts to commit."
          fi
