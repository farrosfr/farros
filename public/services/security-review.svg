    <circle cx="850" cy="710" r="3"/>
    <circle cx="500" cy="900" r="3"/>
    <circle cx="150" cy="710" r="3"/>
    <circle cx="150" cy="290" r="3"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1dd5ed" opacity="0.55">
    <text x="490" y="80">threat.scan()</text>
    <text x="780" y="280">audit</text>
    <text x="780" y="730">vuln.check</text>
    <text x="430" y="930">hardened</text>
