<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Security review shield">
  <defs>
    <linearGradient id="bg-sr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a1f"/>
      <stop offset="100%" stop-color="#040a0d"/>
    </linearGradient>
    <linearGradient id="shield-sr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1dd5ed"/>
      <stop offset="100%" stop-color="#3b8eff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg-sr)"/>
  <g stroke="#1a3540" stroke-width="1" fill="none" opacity="0.6">
