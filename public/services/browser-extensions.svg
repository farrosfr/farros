<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Browser extensions and automation">
  <defs>
    <linearGradient id="bg-be" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#040813"/>
    </linearGradient>
    <linearGradient id="win-be" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2c4a"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg-be)"/>
  <g>
    <rect x="150" y="200" width="500" height="380" rx="14" fill="url(#win-be)" stroke="#3b8eff" stroke-width="2"/>
    <rect x="150" y="200" width="500" height="48" rx="14" fill="#0a1428"/>
    <rect x="150" y="232" width="500" height="16" fill="#0a1428"/>
    <g fill="#3b8eff">
      <circle cx="180" cy="224" r="6"/>
      <circle cx="200" cy="224" r="6"/>
      <circle cx="220" cy="224" r="6"/>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1dd5ed" opacity="0.5">
      <text x="350" y="228">// content.js</text>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#a0aec0">
      <text x="180" y="290" fill="#3b8eff">browser.action.onClicked.addListener(</text>
      <text x="200" y="315" fill="#1dd5ed">async</text>
      <text x="260" y="315">(tab) =&gt; {</text>
      <text x="220" y="340" fill="#a0aec0">const data = await scrape(tab.id);</text>
      <text x="220" y="365" fill="#a0aec0">await sendToBackend(data);</text>
      <text x="220" y="390" fill="#3b8eff">chrome.notifications.create('done');</text>
      <text x="200" y="420" fill="#3b8eff">});</text>
      <text x="180" y="450" fill="#3b8eff">manifest_version: 3</text>
    </g>
    <g>
      <rect x="720" y="240" width="160" height="160" rx="14" fill="#0a1428" stroke="#1dd5ed" stroke-width="2"/>
      <circle cx="800" cy="300" r="34" fill="#1dd5ed"/>
      <g stroke="#0a1428" stroke-width="4" fill="none">
        <path d="M786 300 L796 310 L816 290"/>
      </g>
      <rect x="740" y="360" width="120" height="8" rx="2" fill="#3b8eff"/>
      <rect x="740" y="376" width="80" height="6" rx="2" fill="#1c2c4a"/>
    </g>
  </g>
  <g>
    <rect x="400" y="640" width="500" height="220" rx="14" fill="url(#win-be)" stroke="#3b8eff" stroke-width="1.5" opacity="0.85"/>
    <g fill="#0a1428" stroke="#1dd5ed" stroke-width="1.5">
      <rect x="430" y="670" width="60" height="60" rx="8"/>
      <rect x="510" y="670" width="60" height="60" rx="8"/>
      <rect x="590" y="670" width="60" height="60" rx="8"/>
      <rect x="670" y="670" width="60" height="60" rx="8"/>
      <rect x="750" y="670" width="60" height="60" rx="8"/>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#1dd5ed" opacity="0.7">
      <text x="445" y="754">tabs</text>
      <text x="522" y="754">net</text>
      <text x="600" y="754">storage</text>
      <text x="678" y="754">script</text>
      <text x="755" y="754">webReq</text>
    </g>
    <rect x="430" y="790" width="380" height="48" rx="8" fill="#0a1428" stroke="#1c2c4a" stroke-width="1"/>
    <text x="450" y="820" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#3b8eff">chrome.permissions.request({origins: ['&lt;all_urls&gt;']})</text>
  </g>
</svg>
